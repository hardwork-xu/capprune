[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "capprune"
version = "0.1.0"
description = "Auditable exact cosine search with spherical-cap block pruning"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["numpy==2.2.6", "threadpoolctl==3.6.0"]

[project.scripts]
capprune = "capprune.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.13.0", "mypy==1.18.1", "build==1.3.0", "hatchling==1.27.0", "matplotlib==3.10.6", "pyparsing==3.2.3", "scikit-learn==1.7.2", "psutil==7.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/capprune"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/capprune"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.uv]
required-version = "==0.8.22"
