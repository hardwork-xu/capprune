name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.8.22
      - run: uv sync --frozen
      - run: make check
      - run: make build
      - run: .venv/bin/python benchmark.py --smoke --output work/ci-smoke.json
      - run: .venv/bin/python scripts/analyze.py work/ci-smoke.json --output-dir work/ci-analysis
      - run: docker build -t capprune:test .
      - run: docker run --rm capprune:test
